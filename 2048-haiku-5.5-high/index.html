<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex 2048</title>
<style>
  :root {
    --bg: #1f1b16;
    --panel: #2b261f;
    --text: #f9f6f2;
    --muted: #bbada0;
    --empty: #3d362d;
    --btn: #8f7a66;
    --btn-hover: #a38d77;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: 2rem;
    color: #edc22e;
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    background: var(--panel);
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    min-width: 80px;
  }

  .score-box span {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .score-box strong { font-size: 1.2rem; }

  .rules {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .card {
    position: relative;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    justify-content: center;
  }

  #board-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #board {
    position: relative;
  }

  .cell {
    position: absolute;
  }

  .face {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    transform: scale(0.93);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    background: var(--empty);
    color: #776e65;
    user-select: none;
  }

  .cell.spawn { animation: pop 0.18s ease-out; }
  .cell.merge { animation: bump 0.22s ease-out; }

  @keyframes pop {
    0%   { transform: scale(0.3); opacity: 0.4; }
    100% { transform: scale(1);   opacity: 1; }
  }

  @keyframes bump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(2, 120px);
    gap: 8px;
  }

  .dpad button {
    font: inherit;
    font-size: 1.1rem;
    padding: 10px 0;
    border: none;
    border-radius: 8px;
    background: var(--btn);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
  }

  .dpad button:hover,
  .dpad button:focus-visible { background: var(--btn-hover); outline: none; }
  .dpad button:active { transform: translateY(1px); }

  .dpad small {
    display: block;
    font-size: 0.65rem;
    opacity: 0.7;
  }

  .new-game {
    font: inherit;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    background: #edc22e;
    color: #3d3a32;
    font-weight: 700;
    cursor: pointer;
  }

  .new-game:hover { background: #f5cf45; }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(31, 27, 22, 0.82);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 16px;
  }

  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 1.8rem; }
  .overlay p { margin: 0; color: var(--muted); }

  .overlay .row { display: flex; gap: 8px; }

  .overlay button {
    font: inherit;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: var(--btn);
    color: var(--text);
    cursor: pointer;
    font-weight: 700;
  }

  .overlay button.primary { background: #edc22e; color: #3d3a32; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Hex 2048</h1>
    <div class="scores">
      <div class="score-box"><span>Score</span><strong id="score">0</strong></div>
      <div class="score-box"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <p class="rules">
    Slide all tiles in one of six hex directions. Touching equal tiles that move
    together merge into their sum. Reach <b>2048</b> to win.
  </p>

  <div class="card" id="card">
    <div id="board-wrap"><div id="board"></div></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="row" id="ov-buttons"></div>
    </div>
  </div>

  <div class="controls">
    <div class="dpad">
      <button data-dir="upLeft">↖<small>Q</small></button>
      <button data-dir="upRight">↗<small>E</small></button>
      <button data-dir="left">←<small>A / ←</small></button>
      <button data-dir="right">→<small>D / →</small></button>
      <button data-dir="downLeft">↙<small>Z</small></button>
      <button data-dir="downRight">↘<small>C</small></button>
    </div>
    <button class="new-game" id="new-game">New game</button>
  </div>
</div>

<script>
(() => {
  const R = 3;                 // board radius: cells within R steps of center
  const SQ3 = Math.sqrt(3);

  // Axial directions (q, r). Pointy-top hexes; screen layout below.
  const DIRS = {
    left:      [-1,  0],
    right:     [ 1,  0],
    upLeft:    [ 0, -1],
    upRight:   [ 1, -1],
    downLeft:  [-1,  1],
    downRight: [ 0,  1],
  };
  const DIR_NAMES = Object.keys(DIRS);

  const KEYS = {
    ArrowLeft: 'left', ArrowRight: 'right',
    a: 'left', d: 'right',
    q: 'upLeft', e: 'upRight',
    z: 'downLeft', c: 'downRight',
  };

  const PALETTE = {
    2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
    32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
    512: '#edc850', 1024: '#edc53f', 2048: '#edc22e',
  };
  const BIG_TILE = '#3c3a32';

  // ----- geometry -------------------------------------------------------

  const onBoard = (q, r) => Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r)) <= R;
  const key = (q, r) => q + ',' + r;
  const center = (q, r) => ({ x: SQ3 * (q + r / 2), y: 1.5 * r }); // unit size = 1

  const cells = [];
  for (let q = -R; q <= R; q++)
    for (let r = -R; r <= R; r++)
      if (onBoard(q, r)) cells.push({ q, r, k: key(q, r), ...center(q, r) });

  const minX = Math.min(...cells.map(c => c.x)) - SQ3 / 2;
  const maxX = Math.max(...cells.map(c => c.x)) + SQ3 / 2;
  const minY = Math.min(...cells.map(c => c.y)) - 1;
  const maxY = Math.max(...cells.map(c => c.y)) + 1;
  const EXT_W = maxX - minX;
  const EXT_H = maxY - minY;

  // ----- state ----------------------------------------------------------

  let grid = new Map();        // key -> value (0 = empty)
  let score = 0;
  let best = loadBest();
  let won = false;             // 2048 reached already (keep-going shown once)
  let over = false;
  let spawnKey = null;         // cell to animate as new tile
  let mergedKeys = new Set();  // cells to animate as merged
  let scale = 30;              // px per unit

  function loadBest() {
    try { return Number(localStorage.getItem('hex2048-best')) || 0; }
    catch (e) { return 0; }
  }

  function saveBest() {
    try { localStorage.setItem('hex2048-best', String(best)); }
    catch (e) { /* storage unavailable, ignore */ }
  }

  function newGame() {
    grid = new Map();
    cells.forEach(c => grid.set(c.k, 0));
    score = 0;
    won = false;
    over = false;
    spawnKey = null;
    mergedKeys = new Set();
    spawnRandom(2);
    hideOverlay();
    render();
  }

  function spawnRandom(n) {
    for (let i = 0; i < n; i++) {
      const empties = [];
      for (const [k, v] of grid) if (!v) empties.push(k);
      if (!empties.length) return;
      const k = empties[Math.floor(Math.random() * empties.length)];
      grid.set(k, Math.random() < 0.9 ? 2 : 4);
      spawnKey = k;
    }
  }

  // ----- sliding logic --------------------------------------------------

  // vals ordered from start to end of a line; tiles slide toward the end.
  function slideLine(vals) {
    const n = vals.length;
    const tiles = [];
    for (let i = n - 1; i >= 0; i--) if (vals[i]) tiles.push(vals[i]);

    const out = new Array(n).fill(0);
    const mergeIdx = [];
    let gain = 0;
    let j = 0;
    for (let i = 0; i < tiles.length; i++) {
      const pos = n - 1 - j;
      if (i + 1 < tiles.length && tiles[i] === tiles[i + 1]) {
        const v = tiles[i] * 2;
        out[pos] = v;
        mergeIdx.push(pos);
        gain += v;
        i++;
      } else {
        out[pos] = tiles[i];
      }
      j++;
    }
    return { out, gain, mergeIdx };
  }

  // Compute the result of sliding in one direction without mutating state.
  function simulate(dir, from) {
    const [dq, dr] = DIRS[dir];
    const next = new Map(from);
    const merged = new Set();
    let gained = 0;
    let changed = false;

    for (const c of cells) {
      if (onBoard(c.q - dq, c.r - dr)) continue;   // only start at line heads
      const line = [];
      for (let q = c.q, r = c.r; onBoard(q, r); q += dq, r += dr) line.push(key(q, r));

      const vals = line.map(k => from.get(k));
      const res = slideLine(vals);
      line.forEach((k, i) => {
        if (res.out[i] !== vals[i]) changed = true;
        next.set(k, res.out[i]);
      });
      res.mergeIdx.forEach(i => merged.add(line[i]));
      gained += res.gain;
    }
    return { next, gained, merged, changed };
  }

  function hasMoves() {
    return DIR_NAMES.some(d => simulate(d, grid).changed);
  }

  function move(dir) {
    if (over) return;
    const res = simulate(dir, grid);
    if (!res.changed) return;

    grid = res.next;
    score += res.gained;
    mergedKeys = res.merged;
    spawnKey = null;
    if (score > best) { best = score; saveBest(); }

    spawnRandom(1);

    const full = [...grid.values()].every(v => v);
    if (!won && [...grid.values()].includes(2048)) {
      won = true;
      showOverlay('You win!', 'You made a 2048 tile. Keep going for a higher score?', [
        { label: 'Keep going', primary: true, action: hideOverlay },
        { label: 'New game', action: newGame },
      ]);
    }
    if (full && !hasMoves()) {
      over = true;
      showOverlay('Game over', `Final score: ${score}`, [
        { label: 'Try again', primary: true, action: newGame },
      ]);
    }
    render();
  }

  // ----- rendering ------------------------------------------------------

  const boardEl = document.getElementById('board');
  const boardWrap = document.getElementById('board-wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  function colorFor(v) { return PALETTE[v] || BIG_TILE; }

  function fontFor(digits) {
    if (digits <= 2) return 0.75;
    if (digits === 3) return 0.6;
    return 0.48;
  }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    boardEl.innerHTML = '';

    for (const c of cells) {
      const v = grid.get(c.k);
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.left = ((c.x - minX) * scale - SQ3 * scale / 2) + 'px';
      el.style.top = ((c.y - minY) * scale - scale) + 'px';
      el.style.width = (SQ3 * scale) + 'px';
      el.style.height = (2 * scale) + 'px';
      if (c.k === spawnKey) el.classList.add('spawn');
      if (mergedKeys.has(c.k)) el.classList.add('merge');

      const face = document.createElement('div');
      face.className = 'face';
      if (v) {
        const digits = String(v).length;
        face.textContent = v;
        face.style.background = colorFor(v);
        face.style.color = v <= 4 ? '#776e65' : '#f9f6f2';
        face.style.fontSize = (scale * fontFor(digits)) + 'px';
      }
      el.appendChild(face);
      boardEl.appendChild(el);
    }
  }

  function layout() {
    const availW = boardWrap.clientWidth;
    const maxH = Math.max(260, window.innerHeight * 0.5);
    scale = Math.max(12, Math.min(availW / EXT_W, maxH / EXT_H));
    boardEl.style.width = (EXT_W * scale) + 'px';
    boardEl.style.height = (EXT_H * scale) + 'px';
    render();
  }

  // ----- overlay --------------------------------------------------------

  const overlayEl = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const ovButtons = document.getElementById('ov-buttons');

  function showOverlay(title, text, buttons) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovButtons.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      if (b.primary) btn.className = 'primary';
      btn.addEventListener('click', b.action);
      ovButtons.appendChild(btn);
    }
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  // ----- input ----------------------------------------------------------

  window.addEventListener('keydown', e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const dir = KEYS[k];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => move(btn.dataset.dir));
  });

  document.getElementById('new-game').addEventListener('click', newGame);
  window.addEventListener('resize', layout);

  newGame();
  layout();
})();
</script>
</body>
</html>
