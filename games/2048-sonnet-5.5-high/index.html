<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hex 2048</title>
<style>
  :root {
    --bg: #12141c;
    --bg2: #1b1f2c;
    --panel: #23283a;
    --cell: #2c3248;
    --text: #e8eaf2;
    --muted: #8b92aa;
    --accent: #25c2a8;
    --accent2: #f6b267;
    --ms: 120ms;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #20263a 0%, var(--bg) 60%) fixed;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-size: clamp(28px, 7vw, 44px); font-weight: 900; letter-spacing: 1px; line-height: 1;
    background: linear-gradient(90deg, var(--accent2), #e63e6d 45%, #6a63e6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 small { font-size: .5em; letter-spacing: 3px; color: var(--muted); -webkit-text-fill-color: var(--muted); margin-left: 6px; font-weight: 700; }
  .scores { display: flex; gap: 8px; }
  .box { background: var(--panel); border-radius: 10px; padding: 6px 16px; text-align: center; min-width: 84px; }
  .box label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
  .box b { font-size: 22px; font-variant-numeric: tabular-nums; }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; flex: 1 1 260px; line-height: 1.35; }
  .hint b { color: var(--text); }
  .btns { display: flex; gap: 8px; align-items: center; }
  button, select {
    font: inherit; font-weight: 700; font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid #343b55; border-radius: 10px;
    padding: 8px 14px; cursor: pointer; transition: background .15s, transform .08s;
  }
  button:hover, select:hover { background: #2d3350; }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: linear-gradient(135deg, #e63e6d, #f6844f); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.1); background: linear-gradient(135deg, #e63e6d, #f6844f); }

  #stage { width: 100%; display: flex; justify-content: center; }
  #board { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cells, #tiles { position: absolute; inset: 0; }
  .cell, .tile { position: absolute; left: 0; top: 0; width: calc(var(--s) * 2); height: calc(var(--s) * 1.7320508); }
  .hex {
    position: absolute; inset: calc(var(--s) * .05);
    clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
  }
  .cell .hex { background: var(--cell); }
  .tile { transition: transform var(--ms) ease-in-out; will-change: transform; }
  .tile .hex {
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    background-image: linear-gradient(160deg, rgba(255,255,255,.22), rgba(0,0,0,.1));
  }

  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; background: rgba(18,20,28,.78); backdrop-filter: blur(3px);
    border-radius: 18px; z-index: 50; animation: fade .3s ease both;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: clamp(30px, 8vw, 52px); font-weight: 900; }
  #overlay p { margin: 0 0 6px; color: var(--muted); }
  #overlay .row { display: flex; gap: 10px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; }
  .pad button { padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 3px; }
  .pad button span { font-size: 22px; }
  .pad button em { font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .keys { margin: 0; text-align: center; color: var(--muted); font-size: 13px; }
  kbd { background: var(--panel); border: 1px solid #343b55; border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 12px; color: var(--text); }
  @media (hover: none) and (pointer: coarse) { .keys { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>HEX<small>2048</small></h1>
    <div class="scores">
      <div class="box"><label>Score</label><b id="score">0</b></div>
      <div class="box"><label>Best</label><b id="best">0</b></div>
    </div>
  </header>

  <div class="bar">
    <p class="hint">Slide tiles in <b>six directions</b>. Matching tiles merge. Reach <b>2048</b>!</p>
    <div class="btns">
      <select id="size" aria-label="Board size">
        <option value="2">Small (19)</option>
        <option value="3">Large (37)</option>
      </select>
      <button id="undo" title="Undo (U)">Undo</button>
      <button id="new" class="primary">New game</button>
    </div>
  </div>

  <div id="stage">
    <div id="board">
      <div id="cells"></div>
      <div id="tiles"></div>
      <div id="overlay">
        <h2 id="ovTitle"></h2>
        <p id="ovText"></p>
        <div class="row">
          <button id="ovKeep">Keep going</button>
          <button id="ovNew" class="primary">New game</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pad" id="pad"></div>
  <p class="keys">
    <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> / <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> to slide &middot; <kbd>U</kbd> undo &middot; or swipe on the board
  </p>
</div>

<script>
(() => {
  'use strict';

  const SQ3 = Math.sqrt(3);
  const MOVE_MS = 120;
  const WIN_VALUE = 2048;

  // Flat-top hexes, axial coords (q, r). Screen: x = 1.5*q, y = sqrt3*(r + q/2).
  const DIRS = [
    { name: 'N',  key: 'w', dq:  0, dr: -1, arrow: '↑' },
    { name: 'NE', key: 'e', dq:  1, dr: -1, arrow: '↗' },
    { name: 'SE', key: 'd', dq:  1, dr:  0, arrow: '↘' },
    { name: 'S',  key: 's', dq:  0, dr:  1, arrow: '↓' },
    { name: 'SW', key: 'a', dq: -1, dr:  1, arrow: '↙' },
    { name: 'NW', key: 'q', dq: -1, dr:  0, arrow: '↖' },
  ];
  const KEYMAP = {};
  DIRS.forEach((d, i) => { KEYMAP[d.key] = i; });
  KEYMAP['arrowup'] = 0; KEYMAP['arrowdown'] = 3;

  const PALETTE = {
    2:    ['#ece6d6', '#5b5445'],
    4:    ['#f3dba4', '#5b4a22'],
    8:    ['#f7b267', '#ffffff'],
    16:   ['#f4895f', '#ffffff'],
    32:   ['#ef6351', '#ffffff'],
    64:   ['#e63e6d', '#ffffff'],
    128:  ['#c93fa0', '#ffffff'],
    256:  ['#9b4fd4', '#ffffff'],
    512:  ['#6a63e6', '#ffffff'],
    1024: ['#3d8bef', '#ffffff'],
    2048: ['#25c2a8', '#04302a'],
    4096: ['#f6d24a', '#3a2c00'],
    8192: ['#ffffff', '#222222'],
  };
  const BEYOND = ['#0c0c14', '#f6d24a'];

  const $ = id => document.getElementById(id);
  const board = $('board'), cellsLayer = $('cells'), tilesLayer = $('tiles');
  const overlay = $('overlay');

  let R = 2;
  let cells = [];            // [{q,r}]
  let cellEls = [];
  let cellSet = new Set();
  let grid = new Map();      // "q,r" -> tile
  let score = 0, best = 0;
  let won = false, over = false;
  let undoStack = [];
  let pending = null;
  let S = 60, W = 0, H = 0;

  const key = (q, r) => q + ',' + r;
  const inBoard = (q, r) => cellSet.has(key(q, r));

  // ---- storage (optional) ----
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } }
  const bestKey = () => 'hex2048-best-' + R;

  // ---- board geometry ----
  function buildCells() {
    cells = []; cellSet = new Set();
    for (let q = -R; q <= R; q++)
      for (let r = -R; r <= R; r++)
        if (Math.abs(q + r) <= R) { cells.push({ q, r }); cellSet.add(key(q, r)); }
    cellsLayer.textContent = '';
    cellEls = cells.map(c => {
      const el = document.createElement('div');
      el.className = 'cell';
      el.innerHTML = '<div class="hex"></div>';
      cellsLayer.appendChild(el);
      return el;
    });
  }

  function place(el, q, r) {
    const x = S * 1.5 * q + W / 2 - S;
    const y = S * SQ3 * (r + q / 2) + H / 2 - S * SQ3 / 2;
    el.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
  }

  function layout() {
    const stageW = $('stage').clientWidth || 340;
    const availW = Math.min(stageW, 680);
    const availH = Math.max(window.innerHeight - 330, 340);
    S = Math.max(14, Math.min(availW / (3 * R + 2), availH / (SQ3 * (2 * R + 1))));
    W = S * (3 * R + 2);
    H = SQ3 * S * (2 * R + 1);
    board.style.setProperty('--s', S.toFixed(2) + 'px');
    board.style.width = W.toFixed(2) + 'px';
    board.style.height = H.toFixed(2) + 'px';
    cells.forEach((c, i) => place(cellEls[i], c.q, c.r));
    grid.forEach(t => place(t.el, t.q, t.r));
    if (pending) pending.merges.forEach(m => place(m.u.el, m.u.q, m.u.r));
  }

  // ---- tiles ----
  function palette(v) { return PALETTE[v] || BEYOND; }

  function render(t) {
    const p = palette(t.value);
    const hex = t.hex;
    hex.style.backgroundColor = p[0];
    hex.style.color = p[1];
    hex.textContent = t.value;
    const len = String(t.value).length;
    const k = len <= 2 ? 0.66 : len === 3 ? 0.54 : len === 4 ? 0.43 : 0.35;
    hex.style.fontSize = 'calc(var(--s) * ' + k + ')';
    t.el.style.zIndex = '';
    let glow = '';
    if (t.value >= WIN_VALUE) glow = 'drop-shadow(0 0 calc(var(--s) * .28) ' + p[0] + ')';
    else if (t.value >= 128) glow = 'drop-shadow(0 0 calc(var(--s) * .14) ' + p[0] + ')';
    t.el.style.filter = glow;
    if (t.value > WIN_VALUE * 2) hex.style.outline = 'none';
  }

  function makeTile(q, r, value, animateSpawn) {
    const el = document.createElement('div');
    el.className = 'tile';
    const hex = document.createElement('div');
    hex.className = 'hex';
    el.appendChild(hex);
    const t = { q, r, value, el, hex };
    place(el, q, r);
    render(t);
    tilesLayer.appendChild(el);
    grid.set(key(q, r), t);
    if (animateSpawn) {
      hex.animate(
        [{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 160, delay: animateSpawn === true ? 0 : animateSpawn, fill: 'backwards', easing: 'ease-out' }
      );
    }
    return t;
  }

  function pop(t) {
    t.hex.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }],
      { duration: 180, easing: 'ease-out' }
    );
  }

  function spawn(delay) {
    const empties = cells.filter(c => !grid.has(key(c.q, c.r)));
    if (!empties.length) return;
    const c = empties[Math.floor(Math.random() * empties.length)];
    makeTile(c.q, c.r, Math.random() < 0.9 ? 2 : 4, delay || true);
  }

  function clearTiles() {
    finalizePending();
    tilesLayer.textContent = '';
    grid.clear();
  }

  // ---- game flow ----
  function finalizePending() {
    if (!pending) return;
    clearTimeout(pending.timer);
    const p = pending;
    pending = null;
    p.merges.forEach(m => { m.u.el.remove(); render(m.t); pop(m.t); });
  }

  function snapshot() {
    return { score, won, tiles: Array.from(grid.values()).map(t => ({ q: t.q, r: t.r, value: t.value })) };
  }

  function newGame() {
    clearTiles();
    score = 0; won = false; over = false; undoStack = [];
    hideOverlay();
    const n = R === 2 ? 2 : 3;
    for (let i = 0; i < n; i++) spawn();
    updateHud();
  }

  function undo() {
    if (!undoStack.length) return;
    const s = undoStack.pop();
    clearTiles();
    s.tiles.forEach(t => makeTile(t.q, t.r, t.value, false));
    score = s.score; won = s.won; over = false;
    hideOverlay();
    updateHud();
  }

  function canMove() {
    if (grid.size < cells.length) return true;
    for (const t of grid.values()) {
      for (const d of DIRS) {
        const n = grid.get(key(t.q + d.dq, t.r + d.dr));
        if (n && n.value === t.value) return true;
      }
    }
    return false;
  }

  function move(di) {
    if (over || overlay.classList.contains('show')) return;
    finalizePending();
    const d = DIRS[di];
    const plan = [];
    let changed = false;

    for (const c of cells) {
      if (inBoard(c.q + d.dq, c.r + d.dr)) continue;      // only lead cells start a line
      const line = [];
      let q = c.q, r = c.r;
      while (inBoard(q, r)) { line.push([q, r]); q -= d.dq; r -= d.dr; }
      const ts = [];
      for (const [lq, lr] of line) { const t = grid.get(key(lq, lr)); if (t) ts.push(t); }
      let k = 0;
      for (let i = 0; i < ts.length; i++, k++) {
        const t = ts[i];
        const [dq, dr] = line[k];
        if (i + 1 < ts.length && ts[i + 1].value === t.value) {
          plan.push({ t, dq, dr, u: ts[i + 1] });
          i++; changed = true;
        } else {
          plan.push({ t, dq, dr });
          if (t.q !== dq || t.r !== dr) changed = true;
        }
      }
    }
    if (!changed) return;

    undoStack.push(snapshot());
    if (undoStack.length > 30) undoStack.shift();

    grid.clear();
    const merges = [];
    for (const p of plan) {
      const t = p.t;
      t.q = p.dq; t.r = p.dr;
      grid.set(key(t.q, t.r), t);
      place(t.el, t.q, t.r);
      if (p.u) {
        const u = p.u;
        u.q = p.dq; u.r = p.dr;
        place(u.el, u.q, u.r);
        t.el.style.zIndex = 2;
        t.value *= 2;
        score += t.value;
        merges.push({ t, u });
        if (t.value === WIN_VALUE && !won) { won = true; }
      }
    }

    spawn(MOVE_MS);
    pending = {
      merges,
      timer: setTimeout(finalizePending, MOVE_MS),
    };
    updateHud();

    if (won && !overlay.dataset.wonShown) {
      overlay.dataset.wonShown = '1';
      setTimeout(() => showOverlay('win'), MOVE_MS + 250);
    } else if (!canMove()) {
      over = true;
      setTimeout(() => showOverlay('over'), MOVE_MS + 350);
    }
  }

  // ---- HUD / overlay ----
  function updateHud() {
    $('score').textContent = score;
    if (score > best) { best = score; save(bestKey(), best); }
    $('best').textContent = best;
    $('undo').disabled = undoStack.length === 0;
  }

  function showOverlay(kind) {
    if (kind === 'win') {
      $('ovTitle').textContent = 'You made 2048!';
      $('ovText').textContent = 'Score ' + score + '. Keep going for a higher tile?';
      $('ovKeep').style.display = '';
    } else {
      $('ovTitle').textContent = 'Game over';
      $('ovText').textContent = 'No moves left. Score ' + score + '.';
      $('ovKeep').style.display = 'none';
    }
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
    if (!won) delete overlay.dataset.wonShown;
  }

  // ---- input ----
  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k in KEYMAP) { e.preventDefault(); move(KEYMAP[k]); }
    else if (k === 'u') { e.preventDefault(); undo(); }
  });

  // swipe: pick the direction whose screen vector best matches the drag
  let drag = null;
  board.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = null;
    if (Math.hypot(dx, dy) < 22) return;
    let bestI = 0, bestDot = -Infinity;
    DIRS.forEach((d, i) => {
      const vx = 1.5 * d.dq, vy = SQ3 * (d.dr + d.dq / 2);
      const dot = (vx * dx + vy * dy) / Math.hypot(vx, vy);
      if (dot > bestDot) { bestDot = dot; bestI = i; }
    });
    move(bestI);
  };
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', () => { drag = null; });

  // on-screen pad: Q W E / A S D
  const padOrder = [5, 0, 1, 4, 3, 2];
  const pad = $('pad');
  padOrder.forEach(i => {
    const d = DIRS[i];
    const b = document.createElement('button');
    b.innerHTML = '<span>' + d.arrow + '</span><em>' + d.key.toUpperCase() + '</em>';
    b.setAttribute('aria-label', 'Slide ' + d.name);
    b.addEventListener('click', () => move(i));
    pad.appendChild(b);
  });

  $('new').addEventListener('click', newGame);
  $('ovNew').addEventListener('click', newGame);
  $('ovKeep').addEventListener('click', hideOverlay);
  $('undo').addEventListener('click', undo);
  $('size').addEventListener('change', e => {
    R = parseInt(e.target.value, 10);
    save('hex2048-size', R);
    setupSize();
    newGame();
  });
  window.addEventListener('resize', layout);

  function setupSize() {
    finalizePending();
    buildCells();
    best = parseInt(load(bestKey()), 10) || 0;
    layout();
  }

  // ---- boot ----
  const savedSize = parseInt(load('hex2048-size'), 10);
  if (savedSize === 2 || savedSize === 3) R = savedSize;
  $('size').value = String(R);
  setupSize();
  newGame();
})();
</script>
</body>
</html>
