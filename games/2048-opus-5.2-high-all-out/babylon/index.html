<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hex 2048 · Nightglass</title>
<meta name="description" content="2048 on a hexagonal board: neon glass tiles on an obsidian board, rendered with BabylonJS.">
<meta name="theme-color" content="#05070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../core/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 3h14l7 13-7 13H9L2 16z' fill='%2339e1ff'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" data-variant="babylon">
  <div class="loading" id="loading">
    <div>
      <svg class="spinner" viewBox="0 0 54 62"><path d="M27 4 50 17v28L27 58 4 45V17z"/></svg>
      <p class="load-text">Charging the glass…</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.32.1/babylon.js"></script>
<script src="../core/engine.js"></script>
<script src="../core/kit.js"></script>
<script src="../core/app.js"></script>
<script src="renderer.js"></script>
<script>
HexApp.start({
  variant: 'babylon',
  subtitle: 'Nightglass · BabylonJS',
  voice: 'glass',
  fonts: ['700 64px "Chakra Petch"', '600 28px "Chakra Petch"'],
  feel: { slide: 120, merge: 300, hop: 0.75, drop: 2.2, squash: 0.16 },
  createRenderer: window.createBabylonRenderer,
  other: { name: 'PlayCanvas', href: '../playcanvas/' },
  credit: 'Rendered with <a href="https://www.babylonjs.com" target="_blank" rel="noopener">BabylonJS</a> 9.32: glow layer, blurred mirror reflections, emissive fresnel glass, particle sparks, bloom and filmic post-processing. Rules, HUD and sound are shared with the PlayCanvas version.',
});
</script>
</body>
</html>
