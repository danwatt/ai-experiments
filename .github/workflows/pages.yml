name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # index.html at the repo root is the hand-maintained landing page.
      # Everything else is copied as-is; prompt.md / README.md are rendered to .html.
      - name: Assemble site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          rsync -a \
            --exclude='/_site' --exclude='.git*' --exclude='.claude' --exclude='.idea' \
            --exclude='.serena' --exclude='scripts' --exclude='.DS_Store' \
            --exclude='node_modules' --exclude='.venv' \
            --exclude='tests/' --exclude='**/data/raw/' --exclude='__pycache__' \
            --exclude='.pytest_cache' --exclude='.dockerignore' \
            ./ _site/
          scripts/render-md.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
