[project]
name = "road-trip-planner"
version = "0.0.0"
description = "Road-trip planner backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "osmium>=3.7",
    "shapely>=2.0",
    "timezonefinder>=6.5",  # time zone of a lat/lon, offline (phase 4)
    "tzdata>=2024.1",  # zoneinfo's database, so DST rules do not depend on the OS image
    "astral>=3.2",  # sunset per day (phase 4)
    "gpxpy>=1.6",  # GPX export (phase 5)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
