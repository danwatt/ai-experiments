            a stream strip of five unequal bands in sym-word, sym-rule, sym-esc, sym-word, sym-rule
    arrangement: one tall slab with two satellites, under a full-width strip of unequal bands —
            the stream strip the lab draws over every encoded passage
    pattern: tiles cut by the radius tokens, six merged two-wide — a Re-Pair rule is one symbol
            standing for a pair of words, so the grid of word cells is broken by wider rule cells.
            A generic technical system would land on a plain dot grid; the merged pairs are this codec.
