<!DOCTYPE html>
<html>
<body>
<div class="gt-surface" id="root" style="padding:20px">
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px">
    <button class="button">Run backfill</button>
    <button class="button active">📍 Geocode</button>
    <button class="button primary">Apply this guess</button>
    <button class="button danger">Stop</button>
    <button class="button icon-btn" title="Accept suggestion">✓</button>
    <button class="button icon-btn" title="Ignore face">🚫</button>
    <button class="button" disabled>Recompute</button>
  </div>
  <div class="gt-toolbar" style="border-radius:4px;border-bottom:none">
    <div class="toolbar-group">
      <a class="button active" href="#">🏠 Home</a>
      <a class="button" href="#">🔎 Search</a>
      <a class="button" href="#">🙂 People</a>
    </div>
    <div class="toolbar-spacer"></div>
    <button class="button">Detecting… 3,410 left</button>
    <button class="button danger">Stop</button>
  </div>
</div>
</body>
</html>
