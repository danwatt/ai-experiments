<!-- @dsCard height=288 -->
<!DOCTYPE html>
<html>
<body>
<div id="root">
<style>
  #root { width: 960px; height: 288px; position: relative; background: var(--canvas); overflow: hidden; }
  #root svg { display: block; width: 960px; height: 288px; }
  .brand      { fill: var(--accent); }
  .brand-deep { fill: var(--accent-fill); }
  .pin        { fill: var(--marker); }
  .named      { fill: var(--success); }
  .tile       { fill: var(--accent); rx: 3px; }
  .tile-pin   { fill: var(--marker); rx: 3px; }
  .tile-named { fill: var(--success); rx: 3px; }
  .block      { rx: 4px; }
  #name {
    position: absolute; left: 48px; bottom: 84px;
    font-family: var(--font-ui); font-weight: 800; font-size: 72px; line-height: 0.92;
    letter-spacing: -0.015em; color: var(--ink); margin: 0; max-width: 440px;
  }
  #tagline {
    position: absolute; left: 48px; bottom: 52px;
    font-family: var(--font-ui); font-weight: 400; font-size: 13px; line-height: 18px;
    color: var(--ink-muted); margin: 0; max-width: 440px;
  }
</style>

<!--
  blocks:      accent 192x208 · accent-fill 144x208 (bleeds off the right edge) · marker 96x96 · success 96x96; corners radius-4
  arrangement: one tall brand slab at x=496 with two stacked status satellites, the deep slab carrying the pattern off the right edge; everything right of x=480, the name alone on the ground
  pattern:     geometric, modular, dense UI — tiles cut by the radius tokens, two merged two-wide. GeoTagger is a grid of square 120px tiles in which a handful are pinned, so the cover is that grid: 40-odd radius-3 tiles at a 24px pitch over the deep block, one in marker amber (geotagged) and one in success green (named).
  scales:      pitch 24px = space-16 + space-8, gap space-4, tile 20px, blocks on multiples of space-16, radius-4 on blocks and radius-3 on tiles
-->
<svg viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GeoTagger">
  <rect class="brand block"      x="496" y="40"  width="192" height="208"/>
  <rect class="pin block"        x="704" y="40"  width="96"  height="96"/>
  <rect class="named block"      x="704" y="152" width="96"  height="96"/>
  <rect class="brand-deep block" x="816" y="40"  width="144" height="208"/>

  <g id="grid"></g>
</svg>

<p id="name">GeoTagger</p>
<p id="tagline">A photo library, put in its place.</p>
</div>
<script>
  // The pattern: the app's own photo grid, drawn at a 24px pitch over the deep block.
  // Two tiles are merged two-wide, one is pinned (marker) and one named (success).
  const NS = 'http://www.w3.org/2000/svg';
  const g = document.getElementById('grid');
  const wide = new Set(['1,2', '4,5']);          // row,col of a merged two-wide tile
  const skip = new Set(['1,3', '4,6']);          // the column each merge swallows
  const pinned = '2,4', named = '6,2';
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 6; col++) {
      const key = row + ',' + (col + 1);
      if (skip.has(key)) continue;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', 824 + col * 24);
      r.setAttribute('y', 48 + row * 24);
      r.setAttribute('width', wide.has(key) ? 44 : 20);
      r.setAttribute('height', 20);
      r.setAttribute('class', key === pinned ? 'tile-pin' : key === named ? 'tile-named' : 'tile');
      g.appendChild(r);
    }
  }
</script>
</body>
</html>
