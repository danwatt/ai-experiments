<!-- @dsCard group="Data" height=220 subtitle="Two jobs mid-run, with a stoppable batch loop" -->
<!DOCTYPE html>
<html>
<body>
<div class="gt-surface" id="root" style="padding:16px">
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start">
    <div class="card">
      <h2>Geotagging</h2>
      <div class="progress-bar"><div class="progress-fill" style="width:27%"></div></div>
      <div class="progress-label">12,880 of 48,201 · 27%</div>
      <div class="stat-line highlight">3,410 could be guessed from neighbours</div>
    </div>
    <div class="card">
      <h2>Faces</h2>
      <div class="progress-bar"><div class="progress-fill" style="width:93%"></div></div>
      <div class="progress-label">44,791 of 48,201 · 93%</div>
      <div class="stat-line">3,410 photos not yet scanned</div>
      <div class="card-actions">
        <button class="button">Detecting… 3,410 left</button>
        <button class="button danger">Stop</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
