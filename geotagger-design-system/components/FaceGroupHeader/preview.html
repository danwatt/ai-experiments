<!-- @dsCard group="Media" height=230 subtitle="Five tints, each meaning a different group state" -->
<!DOCTYPE html>
<html>
<body>
<div class="gt-surface" id="root" style="padding:16px;background:var(--pane);display:flex;flex-direction:column;gap:8px">
  <div class="face-group-header" style="border-radius:4px">
    <span class="face-group-label">Cluster 14 <span class="face-group-meta">· 38 faces · 9 photos</span></span>
    <span class="face-group-btns"><button class="button">Name this cluster</button></span>
  </div>
  <div class="face-group-header green" style="border-radius:4px">
    <span class="face-group-label">Marion <span class="face-group-meta">· 212 faces labeled</span></span>
    <span class="face-group-btns"><button class="button">Find more</button></span>
  </div>
  <div class="face-group-header blue" style="border-radius:4px">
    <span class="face-group-label">Suggested: Elias <span class="face-group-meta">· 17 faces · 0.71–0.84</span></span>
    <span class="face-group-btns">
      <button class="button icon-btn" title="Accept all">✓</button>
      <button class="button icon-btn" title="Reject all">✕</button>
    </span>
  </div>
  <div class="face-group-header amber" style="border-radius:4px">
    <span class="face-group-label">Crowd · 22 Jun 2014 <span class="face-group-meta">· 41 faces in 3 photos</span></span>
    <span class="face-group-btns"><button class="button">Come back later</button></span>
  </div>
  <div class="face-group-header grey" style="border-radius:4px">
    <span class="face-group-label">Ignored <span class="face-group-meta">· 96 faces</span></span>
    <span class="face-group-btns"><button class="button">Restore all</button></span>
  </div>
</div>
</body>
</html>
