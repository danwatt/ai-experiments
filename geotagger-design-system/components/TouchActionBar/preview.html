<!-- @dsCard group="Actions" height=210 subtitle="The Quick Tag answer bar" -->
<!DOCTYPE html>
<html>
<body>
<div class="gt-surface" id="root" style="padding:0">
  <div style="max-width:420px;margin:0 auto;border:1px solid var(--hairline);border-radius:8px;overflow:hidden">
    <div style="font-family:var(--font-touch);background:var(--bar);padding:12px 14px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px">
      <span style="color:#9ab;font-size:24px;line-height:1">‹</span>
      <span style="font-weight:700;flex:1">Quick Tag</span>
      <span style="color:#9ab;font-size:14px">12 / 84</span>
    </div>
    <div style="padding:18px 14px;text-align:center;font-family:var(--font-touch)">
      <div style="font-size:22px;line-height:26px;font-weight:800;color:var(--accent-text)">Marion</div>
      <div style="color:#9aa;font-size:13px;margin-top:5px">14 Aug 2011 · 16:22</div>
      <div style="color:var(--place);font-size:13px;margin-top:4px">Skagen, Nordjylland</div>
    </div>
    <div class="gt-actions">
      <button class="act skip">Skip</button>
      <button class="act primary">Yes, tag</button>
      <button class="act">Someone else</button>
      <button class="act danger">Not a face</button>
    </div>
  </div>
</div>
</body>
</html>
