<!DOCTYPE html>
<html>
<body>
<div class="gt-surface" id="root" style="padding:16px;display:flex;flex-direction:column;gap:16px">
  <div style="border:1px solid var(--hairline);border-radius:6px;overflow:hidden">
    <div style="background:var(--pane);height:38px"></div>
    <div class="gt-status-bar">Scanned 4,812 files · 121 new · 3 unreadable</div>
  </div>
  <div style="border:1px solid var(--hairline);border-radius:6px;overflow:hidden">
    <div style="background:var(--pane);height:38px"></div>
    <div class="gt-status-bar error">ExifTool exited with code 1 — sidecar not written</div>
  </div>
  <div style="border:1px solid var(--field-border);border-radius:6px;overflow:hidden">
    <div style="background:var(--canvas);height:38px"></div>
    <div style="padding:4px 12px;font-size:12px;color:var(--ink-soft);background:var(--chrome-alt);border-top:1px solid var(--field-border);min-height:22px">
      12,880 places loaded from GeoNames
    </div>
  </div>
</div>
</body>
</html>
